<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle | Homepage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">

    <link href="css/styles.css" rel="stylesheet">

</head>
<body>

    <header>
        <!--GLOBAL NAV BAR-->
        <nav>
            <img alt="Pinnacle Insurance Logo">
            <ul>
                <li>Home</li>
                <li><a href="#">Get a Quote</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <!--HERO SECTION-->
            <h1>Protect what matters most</h1>
            <h2>Get personalized auto, home, and life insurance quotes in minutes. Trusted coverage, transparent pricing, no surprises.</h2>
        </section>

        <section>
            <!--WHY CHOOSE US SECTION
            Starts as 3 Bootstrap cards highlighting benefits, will stack at md breakpoint-->
            <h3>Why choose us?</h3>
            <div>
                <div>
                    <div>
                        <h4>"Fast Quotes"</h4>
                    </div>
                </div>
                <div>
                    <div>
                        <h4>"Trusted Coverage"</h4>
                    </div>
                </div>
                <div>
                    <h4>"24/7 Support"</h4>
                </div>
            </div>
        </section>

        <section>
            <!--INSURANCE TYPES SECTION
            Starts as 3 Bootstrap columns showcasing insurance types, will stack at md breakpoint-->
            <h3>Insurance Types: </h3>
            <div>
                <div>
                    <div>
                        <h4>Auto</h4>
                    </div>
                </div>
                <div>
                    <div>
                        <h4>Home</h4>
                    </div>
                </div>
                <div>
                    <div>
                        <h4>Life</h4>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <!--GLOBAL FOOTER-->
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

</html>
